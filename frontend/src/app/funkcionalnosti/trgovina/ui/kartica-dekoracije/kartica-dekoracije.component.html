<article class="kartica-dekoracije">
  <div class="kartica-dekoracije__slika-spremnik">
    <img
      [src]="apiUrl + dekoracija().slikaDekoracija"
      [alt]="dekoracija().naziv"
      class="kartica-dekoracije__slika"
    />
  </div>

  <div class="kartica-dekoracije__sadrzaj">
    <p class="kartica-dekoracije__tip">
      {{ dekoracija().tipDekoracije.naziv }}
    </p>
    <h3>{{ dekoracija().naziv }}</h3>
    <p>
      {{ dekoracija().opis }}
    </p>

    <div class="kartica-dekoracije__podnozje">
      <div class="kartica-dekoracije__kupnja-novac">
        <app-novac-ikona velicina="18" />

        <span>
          {{ dekoracija().cijenaValuta }}
        </span>
      </div>

      @if (dekoracija().cijenaValuta === null) {
        <button type="button" class="c-button c-button--sekundarna" disabled>
          Otključava se izazovom
        </button>
      } @else if (kupljena()) {
        <button type="button" class="c-button c-button--sekundarna" disabled>
          Kupljeno
        </button>
      } @else {
        <button
          type="button"
          class="c-button c-button--primarna"
          (click)="kupi.emit(dekoracija().dekoracijaId)"
        >
          Kupi
        </button>
      }
    </div>
  </div>
</article>
