<div class="o-stog | profil">
  @if (ucitavanje()) {
    <p>Učitavanje profila</p>
  } @else if (greska()) {
    <p>{{ greska() }}</p>
  } @else {
    @if (profil(); as mojProfil) {
      <app-profil-zaglavlje [profil]="mojProfil" />

      @if (statistika(); as mojaStatistika) {
        <app-profil-statistika
          [xp]="mojaStatistika.xp"
          [brojIzazova]="mojaStatistika.brojIzazova"
          [brojPostignuca]="mojaStatistika.brojPostignuca"
          [brojFotografija]="mojaStatistika.brojFotografija"
          [brojNovcica]="mojaStatistika.brojNovcica"
        />
      }

      <app-profil-rijesene-lokacije [rijeseneLokacije]="rijeseneLokacije()" />

      <app-profil-galerija-posjeta
        [slike]="slikePosjeta()"
        (slikaKliknuta)="otvoriGalerijuPosjeta($event)"
      />

      @if (galerijaOtvorena) {
        <app-modal-galerija-posjeta
          [slike]="slikePosjeta()"
          [pocetniIndex]="odabranaSlikaIndex"
          (zatvori)="zatvoriGalerijuPosjeta()"
        />
      }
    }
  }
</div>
