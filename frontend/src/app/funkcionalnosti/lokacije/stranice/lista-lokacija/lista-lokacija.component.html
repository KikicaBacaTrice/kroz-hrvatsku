<section class="o-stog | lokacije-stranica">
  <header class="o-stog | lokacije-stranica__zaglavlje">
    <h1>Lokacije</h1>
  </header>

  <app-filter-lokacija-forma
    [filter]="filter"
    [kategorije]="kategorije()"
    (primijeni)="primijeniFilter($event)"
    (resetiraj)="resetirajFilter()"
  />

  @if (ucitavanje()) {
    <p>Učitavanje lokacija</p>
  } @else if (greska()) {
    <p>{{ greska() }}</p>
  } @else {
    <div class="lokacije-stranica__resetka">
      @for (lokacija of lokacije(); track lokacija.lokacijaId) {
        <app-kartica-lokacije
          [lokacija]="lokacija"
          [rijesena]="dolasci.jeLokacijaRijesena(lokacija.lokacijaId)"
        />
      }
    </div>
  }
</section>
