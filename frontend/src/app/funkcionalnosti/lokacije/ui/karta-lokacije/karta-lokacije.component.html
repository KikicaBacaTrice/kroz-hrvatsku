<div class="lokacija-karta">
  <div class="lokacija-karta__zaglavlje">
    <h4>Mapa lokacije</h4>
    <a
      [href]="googleUputeKakoDociUrl()"
      target="_blank"
      rel="noopener noreferrer"
    >
      <button class="c-button c-button--primarna">
        <app-direkcija-ikona boja="#fff" velicina="24" /> Kako dići
      </button>
    </a>
  </div>

  <iframe
    width="100%"
    height="400"
    style="border: 0"
    loading="lazy"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"
    [src]="googleKarteSrc()"
  >
  </iframe>

  <div class="lokacija-karta__koordinate-spremnik">
    <img src="/slike/ikone/kategorija-ikona.png" alt="Ikona kategorije" />

    <div class="lokacija-karta__koodrinate">
      <span class="lokacija-karta__koodrinate-naziv">{{
        lokacija().naziv
      }}</span>
      <span class="lokacija-karta__koodrinate-sirina-duzina"
        >{{ lokacija().geoSirina }}&deg; N, {{ lokacija().geoDuzina }}&deg;
        E</span
      >
    </div>
  </div>
</div>
