    ikona="/slike/ikone/lokacija-ikona.png"
    opis="Adresa"
    [vrijednost]="lokacija().adresa"
  />
  <app-kartica-informacije-detalja-lokacije
    ikona="/slike/ikone/novac-ikona.png"
    opis="Cijena ulaznice"

  <app-kartica-informacije-detalja-lokacije
    ikona="/slike/ikone/kategorija-ikona.png"
    opis="Kategorija"

  />
  <app-kartica-informacije-detalja-lokacije
    ikona="/slike/ikone/status-ikona.png"
