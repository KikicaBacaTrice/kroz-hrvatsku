<section class="lokacija-hero">
  @if (glavnaSlika(); as slika) {
    <img
      [src]="apiUrl + slika.putanjaSlike"
      [alt]="slika.opisSlike"
      class="lokacija-hero__slika"
    />
  }

  <div class="lokacija-hero__overlay"></div>

  <div class="lokacija-hero__sadrzaj-spremnik">
    <h1>{{ lokacija().naziv }}</h1>

    <div class="lokacija-hero__meta-podaci">
      <app-zvijezda-ikona velicina="18" />
      <div>
        <span class="lokacija-hero__prosjecna-ocjena">{{
          lokacija().prosjecnaOcjena ?? 0
        }}</span>
        <span class="lokacija-hero__broj-glasova"
          >({{ lokacija().brojOcjena }} glasova)</span
        >
      </div>
    </div>
  </div>
</section>
